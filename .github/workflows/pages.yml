name: Deploy static site to GitHub Pages

# NOTE: GitHub Pages serves STATIC files only. The journal's API
# (/api/submit-paper, /api/papers, /api/download, /api/track, /api/contact)
# runs on Netlify Functions + Neon + Blobs and will NOT work on Pages.
# Pages publishes a viewable static mirror; keep Netlify for the live app.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages via the API on first run if it isn't enabled yet.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root (static HTML/CSS/JS + assets).
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
